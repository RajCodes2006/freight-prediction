  try {
    const binary = atob(parts.join(""));
    const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    const sourceHtml = await new Response(stream).text();
    const doc = new DOMParser().parseFromString(sourceHtml, "text/html");

    if (savedTheme === "light" || savedTheme === "dark") {
      doc.documentElement.dataset.theme = savedTheme;
    }

    const scripts = Array.from(doc.scripts).map((script) => ({
      src: script.src,
      text: script.textContent,
    }));

    document.replaceChild(document.importNode(doc.documentElement, true), document.documentElement);

    scripts.forEach(({ src, text }) => {
      const script = document.createElement("script");
      if (src) {
        script.src = src;
      } else {
        script.textContent = text;
      }
      document.body.appendChild(script);
    });
  } catch (error) {
    document.body.innerHTML = `
      <div style="font-family:system-ui,sans-serif;padding:40px;max-width:720px;margin:auto">
        <h1>Unable to load the About page</h1>
        <p>Please refresh the page. ${error?.message || ""}</p>
